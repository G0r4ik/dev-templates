name: '${PROJECT_NAME:-postdev}'
services:
  db:
    container_name: ${DB_CONTAINER_NAME:-postdev-db-1}
    image: postgres:17-alpine
    env_file: .env
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tmp:/tmp/
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3

  pgadmin4:
    image: dpage/pgadmin4
    ports:
      - '${PG4_PORT:-5050}:80'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker_volume/pgadmin_data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG4_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PG4_PASSWORD:-admin}

volumes:
  postgres_data:
    external: true
