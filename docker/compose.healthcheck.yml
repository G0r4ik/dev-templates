services:
  backend:
    build: ./server
    container_name: gamewords-backend
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN}
      DATABASE_PATH: /app/data/gamewords.db
      PORT: 8000
    volumes:
      - db_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8000/api/ping').then(r => process.exit(r.ok ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./web
    container_name: gamewords-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
